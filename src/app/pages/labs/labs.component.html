<div class="container">
  <h1>Events</h1>
  <h2>{{ welcome }} {{ name() }}</h2>
  <ul>
    <li *ngFor="let task of tasks">
      {{ task }}
    </li>
  </ul>
  Age:
  <input type="number" [value]="person.age" (change)="changeHandler($event)" />
  Name: 
  <input type="text" [value]="person.name" (change)="changeHandler($event)" />
  <input type="text" [value]="person.lastName" (keydown)="keydownHandler($event)" />
  <!-- <input type="text" [value]="person.age" (keydown.shift.t)="clickHandler($event)" /> -->

  <h1>Signals</h1>
  <div *ngIf="name() === 'Fabián'; else elseBlock">
    <h2>Hola, soy yo, {{ name() }}</h2>
  </div>
  <ng-template #elseBlock>
    <h2>Hola {{ name() }}</h2>
  </ng-template>
  <hr />
  <input type="color" [formControl]="colorCtrl">
  <p>Color: {{ colorCtrl.value }}</p>
  
</div>
